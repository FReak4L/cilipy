[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-search-v3"
version = "3.0.0"
description = "Standalone Modular Federated Search Architecture v3 with Pure-Math/NLP Optimization Kernel"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "curl-cffi>=0.10.0",
    "lxml>=5.1.0",
    "cssselect>=1.2.0",
    "aiosqlite>=0.20.0",
    "tenacity>=8.2.3",
    "rich>=13.7.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
ddgs = ["ddgs>=9.0.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
search-v3 = "cli.main:main"
search-v3-mcp = "mcp_server.server:main"

[tool.setuptools]
packages = [
    "core",
    "math_kernel",
    "transport",
    "engine",
    "plugins",
    "plugins.google",
    "plugins.yahoo",
    "plugins.duckduckgo",
    "plugins.searxng",
    "cli",
    "mcp_server",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
