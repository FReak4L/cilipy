version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/bot"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "sha2"
        versions: [">= 0.11.0"]
  - package-ecosystem: "pip"
    directory: "/mcp/search-v3"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/mcp/skills-catalog"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
