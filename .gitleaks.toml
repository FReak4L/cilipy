title = "cilipy gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Ignore untracked/generated build and dependency directories"
paths = [
  '''(^|/)target/''',
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
]

[[allowlists]]
description = "Telegram emoji pack metadata shortcodes under JSON 'key' field (generic-api-key only)"
rules = ["generic-api-key"]
regexTarget = "line"
regexes = [
  '''"key":\s*"[a-z0-9]+(?:_[a-z0-9]+)+"''',
]
