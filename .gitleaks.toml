  '''(^|/)target/''',
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)skills/telegram-premium-emoji/data/emoji-packs\.json$''',
  '''(^|/)skills/session-handoff/scripts/redaction_linter\.py$''',
  '''(^|/)mcp/search-v3/tests/test_google_standalone\.py$''',
  '''(^|/)bot/crates/agy-core/src/security\.rs$''',
  '''(^|/)bot/crates/agy-ext/src/mcp_client\.rs$''',
  '''(^|/)bot/crates/agy-ext/src/memory\.rs$''',
]
